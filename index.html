<!DOCTYPE html>
<html lang="ja">
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI選書コンシェルジュ Pro</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --rakuten-red: #bf0000; --x-black: #000000; --fb-blue: #1877F2; }
        body { background-color: #f4f7f6; font-family: 'Helvetica Neue', Arial, sans-serif; padding: 20px; }
        .container { max-width: 850px; margin: auto; }
        
        /* PR表記 */
        .pr-mark {
            font-size: 0.75rem;
            color: #666;
            margin-bottom: 5px;
            text-align: right;
        }

        .input-card { border: none; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); padding: 30px; background: white; margin-bottom: 30px; }
        .btn-search { background-color: var(--rakuten-red); color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; width: 100%; transition: background-color 0.2s; }
        .btn-search:hover { background-color: #9d0000; color: white; }
        
        /* 書籍カードのデザイン */
        .book-link { text-decoration: none !important; color: inherit !important; display: block; margin-bottom: 25px; transition: transform 0.2s; border-radius: 15px; }
        .book-link:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.15); }
        .book-card { background: white; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); display: flex; overflow: hidden; position: relative; }
        .book-img-container { width: 180px; min-width: 180px; padding: 15px; display: flex; align-items: center; justify-content: center; background: #fff; }
        .book-img { width: 100%; height: auto; max-height: 220px; object-fit: contain; }
        .book-detail { padding: 25px; flex-grow: 1; display: flex; flex-direction: column; border-left: 1px solid #f0f0f0; }
        .price { color: var(--rakuten-red); font-weight: bold; font-size: 1.3rem; }
        .review-info { font-size: 0.85rem; color: #666; margin-bottom: 8px; }
        
        /* SNSボタン */
        .sns-container { position: absolute; top: 12px; right: 12px; z-index: 20; display: flex; gap: 8px; }
        .btn-sns { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white !important; font-size: 0.9rem; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: opacity 0.2s; text-decoration: none; border: none; }
        
        #loading { display: none; text-align: center; padding: 50px; }
        
        /* フッターエリア */
        .app-footer { margin-top: 50px; padding-top: 20px; border-top: 1px solid #ddd; text-align: center; font-size: 0.8rem; color: #777; }
        .app-footer a { color: #bf0000; text-decoration: none; }
        
        @media (max-width: 600px) { 
            .book-card { flex-direction: column; } 
            .book-img-container { width: 100%; height: 200px; } 
            .book-detail { border-left: none; border-top: 1px solid #f0f0f0; } 
        }
    </style>
</head>
<body>
    <div class="container">
        <p class="pr-mark">※本サイトはプロモーションが含まれています</p>
        
        <h2 class="text-center mb-4 fw-bold" style="color: var(--rakuten-red);">📚 AI選書コンシェルジュ Pro</h2>
        
        <div class="input-card">
            <form id="searchForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">年代</label>
                        <select id="age" class="form-select">
                            <option value="10代">10代</option><option value="20代">20代</option><option value="30代">30代</option><option value="40代">40代</option><option value="50代〜">50代〜</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">職業</label>
                        <select id="occupation" class="form-select">
                            <option value="会社員">会社員</option><option value="フリーランス">フリーランス</option><option value="経営・役員">経営・役員</option><option value="主婦">主婦</option><option value="学生">学生</option><option value="その他">その他</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-bold">希望スタイル</label>
                        <select id="style" class="form-select">
                            <option value="初心者向け・図解">初心者向け・図解でわかりやすい</option><option value="理論的・専門書">理論からしっかり学べる専門書</option><option value="物語・小説形式">読みやすい物語・小説形式</option><option value="エッセイ・体験談">等身大の体験談・エッセイ</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-bold">性別</label>
                        <div class="d-flex gap-3">
                            <div class="form-check"><input class="form-check-input" type="radio" name="gender" value="女性" checked id="g_f"><label class="form-check-label" for="g_f">女性</label></div>
                            <div class="form-check"><input class="form-check-input" type="radio" name="gender" value="男性" id="g_m"><label class="form-check-label" for="g_m">男性</label></div>
                        </div>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-bold">お悩み（自由入力）</label>
                        <textarea id="trouble" class="form-control" rows="3" placeholder="例：仕事以外の新しい刺激が欲しい。"></textarea>
                    </div>
                    <div class="col-12">
                        <button type="button" id="submitBtn" class="btn btn-search py-3 mt-2">AIに本を厳選してもらう</button>
                    </div>
                </div>
            </form>
        </div>

        <div id="loading">
            <div class="spinner-border text-danger" role="status"></div>
            <p class="mt-3 text-muted">AIコンシェルジュがあなたにおススメの書籍を探しています…</p>
        </div>
        <div id="results"></div>
        
        <footer class="app-footer">
            <p>※当サイトの「選書理由」等はAIによって生成されたものであり、内容の正確性を保証するものではありません。</p>
            <p class="mb-2">
                <a href="https://webservice.rakuten.co.jp/" target="_blank">Supported by Rakuten Developers</a>
            </p>
            <p class="mb-0">&copy; AI選書コンシェルジュ Pro</p>
        </footer>
    </div>

    <script>
        // ★ご自身のGAS URLに書き換えてください
        const GAS_URL = "https://script.google.com/macros/s/AKfycbx-KwQgGVRYouZXwTrHgvjChQVRYLdJEgtdD_B8DdDuTuK7EwQ5yyfGWKelj8KXvCdbsw/exec";
        const REAL_APP_URL = window.location.href;

        document.getElementById('submitBtn').addEventListener('click', searchBooks);

        async function searchBooks() {
            var age = document.getElementById('age').value;
            var occupation = document.getElementById('occupation').value;
            var style = document.getElementById('style').value;
            var gender = document.querySelector('input[name="gender"]:checked').value;
            var trouble = document.getElementById('trouble').value;

            if (!trouble) { alert('お悩みを入力してください。'); return; }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').innerHTML = '';

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ age, gender, occupation, style, trouble })
                });
                const books = await response.json();
                displayResults(books);
            } catch (err) {
                document.getElementById('loading').style.display = 'none';
                alert('エラーが発生しました: ' + err);
            }
        }

        function displayResults(books) {
            document.getElementById('loading').style.display = 'none';
            var resultsDiv = document.getElementById('results');

            if (!Array.isArray(books)) {
                const errorMsg = books.error || "データ形式が正しくありません。";
                resultsDiv.innerHTML = `<div class="alert alert-danger">${errorMsg}</div>`;
                return;
            }

            if (books.length === 0) {
                resultsDiv.innerHTML = '<p class="text-center">該当する本が見つかりませんでした。</p>';
                return;
            }

            var html = '<h4 class="mb-4 fw-bold text-center">AIが ' + books.length + ' 冊を厳選しました</h4>';
            
            books.forEach(function(book) {
                // SNSシェア用のテキスト作成
                var shareText = encodeURIComponent('AIが私に選んでくれた本は『' + book.title + '』でした！\n#AI選書コンシェルジュ');
                var xShare = 'https://twitter.com/intent/tweet?text=' + shareText + '&url=' + encodeURIComponent(REAL_APP_URL);

                html += `
                <div class="position-relative mb-4">
                    <div class="sns-container">
                        <a href="${xShare}" target="_blank" class="btn-sns" style="background-color:#000;" title="Xでシェア"><i class="fa-brands fa-x-twitter"></i></a>
                    </div>
                    <a href="${book.affiliateUrl}" target="_blank" class="book-link">
                        <div class="book-card">
                            <div class="book-img-container">
                                <img src="${book.imageUrl}" class="book-img" alt="${book.title}">
                            </div>
                            <div class="book-detail">
                                <h5 class="fw-bold mb-1">${book.title}</h5>
                                <div class="review-info">
                                    <span style="color:#ffc107;">★ ${book.reviewAverage || '0'}</span> (${book.reviewCount || '0'}件)
                                </div>
                                <p class="small text-secondary flex-grow-1"><strong>💡 推奨理由:</strong> ${book.reason}</p>
                                <div class="d-flex justify-content-between align-items-center mt-2">
                                    <span class="price">¥${(book.price || 0).toLocaleString()}</span>
                                    <span class="btn btn-outline-danger btn-sm px-4 fw-bold">楽天で見る</span>
                                </div>
                            </div>
                        </div>
                    </a>
                </div>`;
            });
            resultsDiv.innerHTML = html;
        }
    </script>
</body>
</html>
